# ── OpenLiteSpeed vhost สำหรับ ppzstudio.com ────────────────────────────────
#
# ยังไม่ได้ติดตั้ง — เอาไปแปะเมื่อพร้อมสลับเว็บจริง (เฟส 5)
# ไฟล์ปลายทาง: /usr/local/lsws/conf/vhosts/ppzstudio.com/vhost.conf
#
# วิธีใช้:
#   1. cp /usr/local/lsws/conf/vhosts/ppzstudio.com/vhost.conf{,.bak-$(date +%F)}
#   2. แปะบล็อกข้างล่างเข้าไป แล้วลบ scripthandler / extprocessor ppzst1542 (ไม่มี PHP แล้ว)
#   3. เปลี่ยน  docRoot  ให้ยังชี้ $VH_ROOT/public_html ไว้เหมือนเดิม (ใช้เป็น fallback)
#   4. systemctl restart lshttpd
#   5. ตรวจ: หน้าแรก / บทความ / รูปใน /uploads / /.well-known/acme-challenge
#
# ย้อนกลับ: คืนไฟล์ .bak แล้ว restart — เว็บ static เดิมกลับมาทันที
# ────────────────────────────────────────────────────────────────────────────

# ปลายทาง Next.js (pm2 ชื่อ ppzweb ฟังที่ 127.0.0.1:3004)
extprocessor ppzweb {
  type                    proxy
  address                 127.0.0.1:3004
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# รูปที่อัปจากหลังบ้าน — LiteSpeed เสิร์ฟตรง ไม่ผ่าน Node
context /uploads {
  location                /home/ppzstudio.com/uploads/
  allowBrowse             1
  # ต้องใช้ "set" ไม่งั้นจะได้ cache-control สองอันซ้อนกับค่า default ของ LiteSpeed
  extraHeaders            set Cache-Control public, max-age=31536000, immutable

  rewrite  {
    enable                0
  }
  phpIniOverride  {
    php_admin_flag engine off
  }
}

# ที่เหลือทั้งหมดวิ่งเข้า Next.js
# (ไม่ต้องมี context /donate แล้ว — ปลดระวางไปเมื่อ 22 ส.ค. 2569
#  /donate จะเข้า Next.js แล้วให้ตาราง redirects พาไป /support)
context / {
  type                    proxy
  handler                 ppzweb
  addDefaultCharset       off
}

# ── ห้ามลบ ─────────────────────────────────────────────────────────────────
# บล็อกนี้มีอยู่แล้วในไฟล์เดิม ต้องคงไว้ ไม่งั้น Let's Encrypt ต่ออายุไม่ได้
